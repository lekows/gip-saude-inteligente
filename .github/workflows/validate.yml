name: Validate GIP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit

  process-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/gip-ui" --no-save --ignore-scripts playwright@1.64.1 esbuild@0.25.12 react@19.2.6 react-dom@19.2.6 lucide-react@0.468.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/gip-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise process navigation with fictional data and production frame policy
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/gip-ui/node_modules/playwright/index.mjs
        run: node --experimental-strip-types --test tests/processGraphBrowser.test.mjs tests/areaValidationBrowser.test.mjs tests/hospitalDemoBrowser.test.mjs
